apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: slack-alertmanager-config
  namespace: monitoring
  labels:
    release: monitoring

spec:
  route:
    receiver: slack-notifications
    groupBy:
      - namespace
      - alertname
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: slack-notifications
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: slack_api_url
          channel: "#devops-alerts"
          sendResolved: true
