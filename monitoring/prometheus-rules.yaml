apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: mern-stack-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: mern-stack-alerts
      rules:

        - alert: PodRestarted
          expr: increase(kube_pod_container_status_restarts_total[2m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "🚨 {{ $labels.container }} restarted"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted."


        - alert: BackendPodUnavailable
          expr: kube_deployment_status_replicas_available{deployment="backend"} < kube_deployment_spec_replicas{deployment="backend"}
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "🚨 Backend pod unavailable"
            description: "A backend pod is down or unavailable in namespace {{ $labels.namespace }}."


        - alert: PodCrashLooping
          expr: changes(kube_pod_container_status_restarts_total[1m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} restarted"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted."

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="false"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 2 minutes."

        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} was OOMKilled"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was terminated because of out-of-memory."

        - alert: NodeHighCPU
          expr: |
            100 - (
              avg by(instance) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100
            ) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage has been above 80% for 5 minutes."

        - alert: NodeHighMemory
          expr: |
            (
              1 -
              node_memory_MemAvailable_bytes /
              node_memory_MemTotal_bytes
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage has been above 80% for 5 minutes."

        - alert: NodeDiskPressure
          expr: |
            (
              1 -
              (
                node_filesystem_avail_bytes{mountpoint="/"}
                /
                node_filesystem_size_bytes{mountpoint="/"}
              )
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node disk usage is high"
            description: "Node {{ $labels.instance }} root filesystem usage has been above 80% for 5 minutes."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="false"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node is not ready"
            description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas
            !=
            kube_deployment_status_available_replicas
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment replicas mismatch"
            description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} does not have the expected number of available replicas."

        - alert: DeploymentRolloutStuck
          expr: kube_deployment_status_replicas_unavailable > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Deployment rollout is stuck"
            description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has unavailable replicas for more than 10 minutes."

        - alert: ContainerHighCPU
          expr: |
            (
              rate(container_cpu_usage_seconds_total{
                container!="",
                container!="POD"
              }[5m])
              * 100
            ) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container CPU usage is high"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 80% CPU."

        - alert: ContainerHighMemory
          expr: |
            (
              container_memory_working_set_bytes{
                container!="",
                container!="POD"
              }
              /
              container_spec_memory_limit_bytes{
                container!="",
                container!="POD",
                container_spec_memory_limit_bytes!="0"
              }
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container memory usage is high"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 80% of its memory limit."

        - alert: PVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC usage is high"
            description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is more than 80% full."
