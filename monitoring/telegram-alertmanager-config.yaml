apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram-alertmanager-config
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    receiver: telegram
    groupBy:
      - alertname
      - namespace
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
  receivers:
    - name: telegram
      telegramConfigs:
        - botToken:
            name: telegram-bot-token
            key: bot-token
          chatID: 8445646473
          parseMode: HTML
          sendResolved: true
          message: |-
            {{ if eq .Status "firing" }}🚨 <b>ALERT FIRING</b>{{ else }}✅ <b>ALERT RESOLVED</b>{{ end }}
            {{ range .Alerts }}
            <b>Alert:</b> {{ .Labels.alertname }}
            <b>Severity:</b> {{ .Labels.severity }}
            <b>Namespace:</b> {{ .Labels.namespace }}
            <b>Pod:</b> {{ .Labels.pod }}
            <b>Summary:</b> {{ .Annotations.summary }}
            <b>Description:</b> {{ .Annotations.description }}
            {{ end }}
